services:
  nginx:
    # This will result in no ports being exported.
    # See <https://docs.docker.com/reference/compose-file/merge/#reset-value>.
    ports: !reset []
    # This makes nginx run instead of failing.
    command: !reset []
    labels:
      net.unraid.docker.icon: 'https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/nginx.png'
